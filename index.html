<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoWarehouse 電子名片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Noto Sans TC", sans-serif;
      background: #0A2540;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .panel { text-align: center; max-width: 320px; width: 100%; }
    .logo {
      font-size: 13px; font-weight: 700; letter-spacing: 0.2em;
      color: #8FB8DB; margin-bottom: 16px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p  { font-size: 14px; line-height: 1.7; color: #B8C7D9; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block; margin-top: 24px; padding: 12px 32px;
      background: #FFFFFF; color: #0A2540; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="logo">GOWAREHOUSE</div>

    <div id="state-loading">
      <div class="spinner"></div>
      <p>正在準備名片…</p>
    </div>

    <div id="state-not-in-line" class="hidden">
      <h1>請在 LINE 中開啟</h1>
      <p>這個連結要在 LINE app 內開啟才能發送名片。<br>請把連結貼到 LINE 聊天室（例如 Keep），再從裡面點開。</p>
    </div>

    <div id="state-cancelled" class="hidden">
      <h1>已取消發送</h1>
      <p>沒有選擇任何好友，名片未送出。</p>
      <button class="btn" onclick="sendCard()">重新選擇好友</button>
    </div>

    <div id="state-error" class="hidden">
      <h1>出了點問題</h1>
      <p id="error-msg">發送失敗，請關閉後重試。</p>
      <button class="btn" onclick="sendCard()">再試一次</button>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "2011235332-qAsX0zSV";

    // 多人版:連結帶 ?person=xxx 載入 cards/xxx.json,不帶參數預設 mickey
    const person = (new URLSearchParams(location.search).get("person") || "mickey")
      .replace(/[^a-z0-9-]/gi, "");

    function show(id) {
      for (const s of ["state-loading", "state-not-in-line", "state-cancelled", "state-error"]) {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      }
    }
    function fail(msg) {
      document.getElementById("error-msg").textContent = msg;
      show("state-error");
    }

    async function sendCard() {
      show("state-loading");
      try {
        // 每次現抓最新卡片,避免快取吃到舊版
        const res = await fetch(`cards/${person}.json?t=${Date.now()}`);
        if (!res.ok) { fail(`找不到名片資料(${person})`); return; }
        const card = await res.json();

        const result = await liff.shareTargetPicker([
          { type: "flex", altText: card.altText, contents: card.flex }
        ]);
        if (result) {
          liff.closeWindow();
        } else {
          show("state-cancelled");
        }
      } catch (err) {
        fail("發送失敗:" + (err.message || err));
      }
    }

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (err) {
        fail("LIFF 初始化失敗:" + (err.message || err));
        return;
      }
      if (!liff.isInClient()) { show("state-not-in-line"); return; }
      if (!liff.isApiAvailable("shareTargetPicker")) {
        fail("此 LINE 版本不支援 shareTargetPicker,請更新 LINE app。");
        return;
      }
      sendCard();
    }

    main();
  </script>
</body>
</html>

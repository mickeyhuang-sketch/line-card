    function show(id) {
      for (const s of ["state-loading", "state-not-in-line", "state-cancelled", "state-error"]) {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      }
    }

    async function sendCard() {
      show("state-loading");
      try {
        const res = await liff.shareTargetPicker([
          {
            type: "flex",
            altText: "黃乙真 Mickey｜GoWarehouse 電子名片",
            contents: FLEX_CAROUSEL
          }
        ]);
        if (res) {
          // 發送成功，直接關閉 LIFF 視窗
          liff.closeWindow();
        } else {
          // 使用者在選好友畫面按了取消
          show("state-cancelled");
        }
      } catch (err) {
        document.getElementById("error-msg").textContent = "發送失敗：" + (err.message || err);
        show("state-error");
      }
    }

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (err) {
        document.getElementById("error-msg").textContent = "LIFF 初始化失敗：" + (err.message || err);
        show("state-error");
        return;
      }

      if (!liff.isInClient()) {
        show("state-not-in-line");
        return;
      }

      if (!liff.isApiAvailable("shareTargetPicker")) {
        document.getElementById("error-msg").textContent =
          "此 LINE 版本不支援 shareTargetPicker，請更新 LINE app，或確認 LIFF 設定已開啟 shareTargetPicker。";
        show("state-error");
        return;
      }

      sendCard();
    }

    main();
